<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAULT | Cart</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              background: "#131313",
              surface: "#131313",
              "surface-dim": "#131313",
              "surface-bright": "#393939",
              "surface-container-lowest": "#0e0e0e",
              "surface-container-low": "#1b1c1c",
              "surface-container": "#1f2020",
              "surface-container-highest": "#353535",
              "surface-variant": "#353535",
              "on-surface": "#e4e2e1",
              "on-surface-variant": "#c6c4d9",
              primary: "#c0c1ff",
              "on-primary": "#0c00aa",
              "primary-container": "#2f2fe4",
              "on-primary-container": "#bdbfff",
              secondary: "#c6c6c7",
              "on-secondary": "#2f3131",
              outline: "#908fa2"
            },
            fontFamily: {
              "headline-md": ["Designer", "Bebas Neue", "sans-serif"],
              "headline-lg": ["Designer", "Bebas Neue", "sans-serif"],
              "headline-display": ["Designer", "Bebas Neue", "sans-serif"],
              "body-md": ["Aero Matics", "Designer", "Hanken Grotesk", "sans-serif"],
              "data-mono": ["JetBrains Mono", "monospace"],
              "label-caps": ["Designer", "Hanken Grotesk", "sans-serif"]
            }
          }
        }
      };
    </script>
    <style>
      @font-face {
        font-family: 'Designer';
        src: local('Designer'),
             local('Designer Regular'),
             url('./assets/fonts/Designer.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Aero Matics';
        src: local('Aero Matics Light Italic'),
             local('Aero Matics Light'),
             url('./assets/fonts/AeroMaticsLightItalic.ttf') format('truetype');
        font-weight: 300;
        font-style: italic;
        font-display: swap;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0a0a0a;
        color: #e4e2e1;
        font-family: 'Aero Matics', 'Designer', 'Hanken Grotesk', sans-serif;
        scroll-behavior: smooth;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .cart-item + .cart-item {
        margin-top: 1.5rem;
      }
      .quantity-input {
        width: 4.5rem;
      }
    </style>
  </head>
  <body>
    <header class="fixed top-0 left-0 z-50 flex h-20 w-full items-center justify-between border-b border-surface-variant bg-background/95 px-4 backdrop-blur-xl md:px-16 lg:px-20">
      <a href="index.html" class="site-logo w-16 h-16">
        <img src="./assets/images/logo/vault-logo.png" alt="Vault logo" />
      </a>
      <button id="profile-button" class="flex h-8 w-8 cursor-pointer items-center justify-center rounded-full bg-primary-container" type="button" aria-label="Open sign in">
        <span class="material-symbols-outlined text-sm text-white" style="font-variation-settings: 'FILL' 1;">person</span>
      </button>
    </header>
    <main class="pt-28 px-4 pb-20 sm:px-6 md:px-8 lg:px-10">
      <div class="mx-auto max-w-7xl">
        <div class="mb-10">
          <h1 class="font-headline-lg text-4xl uppercase tracking-[-0.04em] text-white">Your cart</h1>
          <p class="mt-3 max-w-2xl text-body text-on-surface-variant">Review the items you’ve added, update quantities, and proceed to checkout when ready.</p>
        </div>
        <div id="cart-list" class="space-y-6"></div>
        <div class="mt-12 flex flex-col gap-4 rounded-[2rem] border border-[#333] bg-surface p-6 md:flex-row md:items-center md:justify-between">
          <div>
            <p class="text-sm uppercase tracking-[0.24em] text-secondary">Cart total</p>
            <p id="cart-total" class="mt-2 text-3xl font-headline-md text-primary"></p>
          </div>
          <button id="checkout-button" class="h-14 rounded-full bg-primary px-8 text-sm font-label-caps uppercase tracking-[0.24em] text-black transition hover:bg-[#a5a7ff] disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-primary">Proceed to checkout</button>
        </div>
      </div>
    </main>

    <div id="order-complete-overlay" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/70 px-4 backdrop-blur-sm">
      <div class="w-full max-w-md rounded-[2rem] border border-[#333] bg-surface p-8 text-center shadow-[0_20px_60px_rgba(0,0,0,0.5)]">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-primary-container">
          <span class="material-symbols-outlined text-3xl text-white" style="font-variation-settings: 'FILL' 1;">check</span>
        </div>
        <h2 class="mt-6 font-headline-lg text-3xl uppercase tracking-[-0.02em] text-white">Order completed</h2>
        <p class="mt-3 text-sm leading-6 text-on-surface-variant">Your order has been placed successfully. A confirmation has been added to your account.</p>
        <button id="order-complete-home-button" class="mt-8 h-14 w-full rounded-full bg-primary px-8 text-sm font-label-caps uppercase tracking-[0.24em] text-black transition hover:bg-[#a5a7ff]">Return to home</button>
      </div>
    </div>
    <footer class="border-t border-surface-variant bg-surface-container-lowest px-4 py-10 sm:px-6 md:px-8 lg:px-10">
      <div class="mx-auto flex max-w-7xl flex-col gap-6 text-center text-[10px] font-data-mono uppercase tracking-[0.24em] text-secondary md:flex-row md:justify-between md:text-left">
        <span>© 2024 Vault Worldwide. All rights reserved.</span>
      </div>
    </footer>
    <script src="store.js"></script>
    <script>
      function createCartItem(product, quantity) {
        return `
          <div class="cart-item rounded-[1.75rem] border border-[#333] bg-surface p-6 shadow-[0_20px_50px_rgba(0,0,0,0.17)]">
            <div class="grid gap-6 md:grid-cols-[140px_1fr] lg:grid-cols-[180px_1fr]">
              <img class="h-36 w-full rounded-3xl object-cover" src="${product.image}" alt="${product.name}" />
              <div class="flex flex-col justify-between gap-4">
                <div>
                  <p class="text-sm uppercase tracking-[0.24em] text-secondary">${product.brand}</p>
                  <h2 class="mt-2 text-2xl font-headline-md uppercase text-white">${product.name}</h2>
                  <p class="mt-3 text-sm leading-6 text-on-surface-variant">${product.description}</p>
                </div>
                <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                  <div class="flex items-center gap-3">
                    <label class="text-sm uppercase tracking-[0.24em] text-secondary" for="qty-${product.id}">Qty</label>
                    <input id="qty-${product.id}" data-product-id="${product.id}" class="quantity-input rounded-lg border border-[#333] bg-background/80 px-3 py-2 text-sm text-on-surface" type="number" min="1" value="${quantity}" />
                  </div>
                  <div class="flex items-center gap-3">
                    <p class="font-data-mono text-xl text-primary">${formatPrice(product.price * quantity)}</p>
                    <button data-remove-id="${product.id}" class="rounded-full border border-surface-variant px-4 py-2 text-[11px] uppercase tracking-[0.24em] text-on-surface transition hover:border-[#2f2fe4]">Remove</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderCart() {
        const cart = vaultStore.getCart();
        const cartList = document.getElementById('cart-list');
        const checkoutButton = document.getElementById('checkout-button');

        if (cart.length === 0) {
          cartList.innerHTML = `
            <div class="rounded-[1.75rem] border border-[#333] bg-surface p-10 text-center text-on-surface-variant">
              <p>Your cart is empty. Add products from the storefront.</p>
              <a href="listings.html" class="mt-6 inline-flex h-12 items-center justify-center rounded-full border border-primary px-6 text-sm font-label-caps uppercase tracking-[0.24em] text-primary transition hover:bg-primary hover:text-black">Continue shopping</a>
            </div>
          `;
          document.getElementById('cart-total').textContent = formatPrice(0);
          checkoutButton.disabled = true;
          return;
        }

        cartList.innerHTML = cart.map((entry) => {
          const product = vaultStore.getProduct(entry.id);
          return createCartItem(product, entry.quantity);
        }).join('');

        document.getElementById('cart-total').textContent = formatPrice(vaultStore.getCartTotal());
        checkoutButton.disabled = false;
      }

      function handleCartEvents(event) {
        const removeButton = event.target.closest('[data-remove-id]');
        if (removeButton) {
          const productId = removeButton.dataset.removeId;
          vaultStore.removeFromCart(productId);
          renderCart();
          updateCartBadge();
          return;
        }

        const qtyInput = event.target.closest('.quantity-input');
        if (qtyInput) {
          const productId = qtyInput.dataset.productId;
          const quantity = Number(qtyInput.value);
          if (!Number.isNaN(quantity) && quantity > 0) {
            vaultStore.updateCartQuantity(productId, quantity);
            renderCart();
            updateCartBadge();
          }
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        renderCart();
        document.getElementById('cart-list').addEventListener('input', handleCartEvents);
        document.getElementById('cart-list').addEventListener('click', handleCartEvents);

        document.getElementById('profile-button').addEventListener('click', () => {
          window.location.href = 'auth.html';
        });

        document.getElementById('checkout-button').addEventListener('click', () => {
          if (vaultStore.getCart().length === 0) return;
          vaultStore.clearCart();
          updateCartBadge();
          const overlay = document.getElementById('order-complete-overlay');
          overlay.classList.remove('hidden');
          overlay.classList.add('flex');
        });

        document.getElementById('order-complete-home-button').addEventListener('click', () => {
          window.location.href = 'index.html';
        });
      });
    </script>
  </body>
</html>
