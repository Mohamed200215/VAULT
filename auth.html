<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAULT | Sign In / Sign Up</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              background: "#131313",
              surface: "#131313",
              "surface-dim": "#131313",
              "surface-bright": "#393939",
              "surface-container-lowest": "#0e0e0e",
              "surface-container-low": "#1b1c1c",
              "surface-container": "#1f2020",
              "surface-container-highest": "#353535",
              "surface-variant": "#353535",
              "on-surface": "#e4e2e1",
              "on-surface-variant": "#c6c4d9",
              primary: "#c0c1ff",
              "on-primary": "#0c00aa",
              "primary-container": "#2f2fe4",
              "on-primary-container": "#bdbfff",
              secondary: "#c6c6c7",
              "on-secondary": "#2f3131",
              outline: "#908fa2"
            },
            fontFamily: {
              "headline-md": ["Designer", "Bebas Neue", "sans-serif"],
              "headline-lg": ["Designer", "Bebas Neue", "sans-serif"],
              "headline-display": ["Designer", "Bebas Neue", "sans-serif"],
              "body-md": ["Aero Matics", "Designer", "Hanken Grotesk", "sans-serif"],
              "data-mono": ["JetBrains Mono", "monospace"],
              "label-caps": ["Designer", "Hanken Grotesk", "sans-serif"]
            }
          }
        }
      };
    </script>
    <style>
      @font-face {
        font-family: 'Designer';
        src: local('Designer'),
             local('Designer Regular'),
             url('./assets/fonts/Designer.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Aero Matics';
        src: local('Aero Matics Light Italic'),
             local('Aero Matics Light'),
             url('./assets/fonts/AeroMaticsLightItalic.ttf') format('truetype');
        font-weight: 300;
        font-style: italic;
        font-display: swap;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0a0a0a;
        color: #e4e2e1;
        font-family: 'Aero Matics', 'Designer', 'Hanken Grotesk', sans-serif;
        scroll-behavior: smooth;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .site-logo,
      .site-logo img {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .site-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .input-shell:focus {
        outline: none;
        border-color: #2f2fe4;
        box-shadow: 0 0 0 1px #2f2fe4;
      }
    </style>
  </head>
  <body>
    <header class="fixed top-0 left-0 z-50 flex h-20 w-full items-center justify-between border-b border-surface-variant bg-background/95 px-4 backdrop-blur-xl md:px-16 lg:px-20">
      <a href="index.html" class="site-logo w-16 h-16">
        <img src="./assets/images/logo/vault-logo.png" alt="Vault logo" />
      </a>
      <button id="cart-button" class="relative flex items-center text-on-surface-variant transition-colors duration-200 hover:text-primary" type="button" aria-label="Open cart">
        <span class="material-symbols-outlined">local_mall</span>
        <span id="cart-count" class="absolute -right-2 -top-2 hidden h-5 min-w-[1.25rem] items-center justify-center rounded-full bg-primary text-[11px] font-semibold text-black">0</span>
      </button>
    </header>
    <main class="grid min-h-screen place-items-center px-4 pb-16 pt-28 sm:px-6 lg:px-10">
      <div class="w-full max-w-3xl rounded-[2rem] border border-[#333] bg-surface p-8 shadow-[0_25px_80px_rgba(0,0,0,0.35)]">
        <div class="grid gap-8 lg:grid-cols-2">
          <section>
            <p class="font-label-caps text-[11px] uppercase tracking-[0.24em] text-primary">Sign in</p>
            <h1 class="mt-3 text-3xl font-headline-lg uppercase text-white">Access your Vault</h1>
            <form id="sign-in-form" class="mt-8 space-y-4">
              <input id="sign-in-email" class="input-shell w-full rounded-3xl border border-[#333] bg-background/80 px-5 py-4 text-sm text-on-surface placeholder:text-on-surface-variant" type="email" placeholder="Email" autocomplete="email" required />
              <input id="sign-in-password" class="input-shell w-full rounded-3xl border border-[#333] bg-background/80 px-5 py-4 text-sm text-on-surface placeholder:text-on-surface-variant" type="password" placeholder="Password" autocomplete="current-password" required />
              <button class="w-full rounded-full bg-primary py-4 text-sm uppercase tracking-[0.24em] text-black transition hover:bg-[#a5a7ff]" type="submit">Sign in</button>
            </form>
          </section>
          <section>
            <p class="font-label-caps text-[11px] uppercase tracking-[0.24em] text-secondary">New to Vault?</p>
            <h2 class="mt-3 text-3xl font-headline-lg uppercase text-white">Create an account</h2>
            <form id="sign-up-form" class="mt-8 space-y-4">
              <input id="sign-up-name" class="input-shell w-full rounded-3xl border border-[#333] bg-background/80 px-5 py-4 text-sm text-on-surface placeholder:text-on-surface-variant" type="text" placeholder="Full name" autocomplete="name" required />
              <input id="sign-up-email" class="input-shell w-full rounded-3xl border border-[#333] bg-background/80 px-5 py-4 text-sm text-on-surface placeholder:text-on-surface-variant" type="email" placeholder="Email" autocomplete="email" required />
              <input id="sign-up-password" class="input-shell w-full rounded-3xl border border-[#333] bg-background/80 px-5 py-4 text-sm text-on-surface placeholder:text-on-surface-variant" type="password" placeholder="Create password" autocomplete="new-password" required />
              <button class="w-full rounded-full border border-primary bg-transparent py-4 text-sm uppercase tracking-[0.24em] text-primary transition hover:bg-primary hover:text-black" type="submit">Sign up</button>
            </form>
          </section>
        </div>
      </div>
    </main>
    <script src="store.js"></script>
    <script>
      function showAuthToast(message, isError) {
        const existing = document.getElementById('auth-toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.id = 'auth-toast';
        toast.textContent = message;
        Object.assign(toast.style, {
          position: 'fixed',
          right: '20px',
          top: '96px',
          zIndex: 9999,
          background: isError
            ? 'linear-gradient(135deg, rgba(220,38,38,0.95), rgba(248,113,113,0.95))'
            : 'linear-gradient(135deg, rgba(47,47,228,0.95), rgba(192,193,255,0.95))',
          color: isError ? '#fff' : '#000',
          padding: '12px 18px',
          borderRadius: '12px',
          fontSize: '13px',
          fontWeight: '700',
          boxShadow: '0 8px 30px rgba(0,0,0,0.45)'
        });
        document.body.appendChild(toast);
        setTimeout(() => {
          toast.style.transition = 'opacity 300ms ease, transform 300ms ease';
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(-10px)';
          setTimeout(() => toast.remove(), 350);
        }, 2200);
      }

      document.addEventListener('DOMContentLoaded', () => {
        updateCartBadge();

        document.getElementById('cart-button').addEventListener('click', () => {
          window.location.href = 'cart.html';
        });

        // Front-end demo only: no real backend, just a believable local session.
        document.getElementById('sign-in-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('sign-in-email').value.trim();
          if (!email) {
            showAuthToast('Enter your email and password.', true);
            return;
          }
          localStorage.setItem('vaultUser', JSON.stringify({ email }));
          showAuthToast('Signed in — welcome back.');
          setTimeout(() => { window.location.href = 'index.html'; }, 700);
        });

        document.getElementById('sign-up-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const name = document.getElementById('sign-up-name').value.trim();
          const email = document.getElementById('sign-up-email').value.trim();
          if (!name || !email) {
            showAuthToast('Fill in your name and email.', true);
            return;
          }
          localStorage.setItem('vaultUser', JSON.stringify({ name, email }));
          showAuthToast('Account created — welcome to Vault.');
          setTimeout(() => { window.location.href = 'index.html'; }, 700);
        });
      });
    </script>
  </body>
</html>
