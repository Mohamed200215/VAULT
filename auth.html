<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAULT | Sign In / Sign Up</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              background: "#131313",
              surface: "#131313",
              "surface-dim": "#131313",
              "surface-bright": "#393939",
              "surface-container-lowest": "#0e0e0e",
              "surface-container-low": "#1b1c1c",
              "surface-container": "#1f2020",
              "surface-container-highest": "#353535",
              "surface-variant": "#353535",
              "on-surface": "#e4e2e1",
              "on-surface-variant": "#c6c4d9",
              primary: "#c0c1ff",
              "on-primary": "#0c00aa",
              "primary-container": "#2f2fe4",
              "on-primary-container": "#bdbfff",
              secondary: "#c6c6c7",
              "on-secondary": "#2f3131",
              outline: "#908fa2"
            },
            fontFamily: {
              "headline-md": ["Designer", "Bebas Neue", "sans-serif"],
              "headline-lg": ["Designer", "Bebas Neue", "sans-serif"],
              "headline-display": ["Designer", "Bebas Neue", "sans-serif"],
              "body-md": ["Aero Matics", "Designer", "Hanken Grotesk", "sans-serif"],
              "data-mono": ["JetBrains Mono", "monospace"],
              "label-caps": ["Designer", "Hanken Grotesk", "sans-serif"]
            }
          }
        }
      };
    </script>
    <style>
      @font-face {
        font-family: 'Designer';
        src: local('Designer'),
             local('Designer Regular'),
             url('./Designer.otf') format('opentype'),
             url('./Designer (3).otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Aero Matics';
        src: local('Aero Matics Light Italic'),
             local('Aero Matics Light'),
             url('./Aero Matics Light Italic.ttf') format('truetype');
        font-weight: 300;
        font-style: italic;
        font-display: swap;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0a0a0a;
        color: #e4e2e1;
        font-family: 'Aero Matics', 'Designer', 'Hanken Grotesk', sans-serif;
        scroll-behavior: smooth;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
  </head>
  <body>
    <main class="grid min-h-screen place-items-center px-4 py-16 sm:px-6 lg:px-10">
      <div class="w-full max-w-3xl rounded-[2rem] border border-[#333] bg-surface p-8 shadow-[0_25px_80px_rgba(0,0,0,0.35)]">
        <div class="grid gap-8 lg:grid-cols-2">
          <section>
            <p class="font-label-caps text-[11px] uppercase tracking-[0.24em] text-primary">Sign in</p>
            <h1 class="mt-3 text-3xl font-headline-lg uppercase text-white">Access your Vault</h1>
            <form class="mt-8 space-y-4">
              <input class="input-shell w-full rounded-3xl border border-[#333] bg-background/80 px-5 py-4 text-sm text-on-surface placeholder:text-on-surface-variant" type="email" placeholder="Email" />
              <input class="input-shell w-full rounded-3xl border border-[#333] bg-background/80 px-5 py-4 text-sm text-on-surface placeholder:text-on-surface-variant" type="password" placeholder="Password" />
              <button class="w-full rounded-full bg-primary py-4 text-sm uppercase tracking-[0.24em] text-black transition hover:bg-[#a5a7ff]" type="button">Sign in</button>
            </form>
          </section>
          <section>
            <p class="font-label-caps text-[11px] uppercase tracking-[0.24em] text-secondary">New to Vault?</p>
            <h2 class="mt-3 text-3xl font-headline-lg uppercase text-white">Create an account</h2>
            <form class="mt-8 space-y-4">
              <input class="input-shell w-full rounded-3xl border border-[#333] bg-background/80 px-5 py-4 text-sm text-on-surface placeholder:text-on-surface-variant" type="text" placeholder="Full name" />
              <input class="input-shell w-full rounded-3xl border border-[#333] bg-background/80 px-5 py-4 text-sm text-on-surface placeholder:text-on-surface-variant" type="email" placeholder="Email" />
              <input class="input-shell w-full rounded-3xl border border-[#333] bg-background/80 px-5 py-4 text-sm text-on-surface placeholder:text-on-surface-variant" type="password" placeholder="Create password" />
              <button class="w-full rounded-full border border-primary bg-transparent py-4 text-sm uppercase tracking-[0.24em] text-primary transition hover:bg-primary hover:text-black" type="button">Sign up</button>
            </form>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
